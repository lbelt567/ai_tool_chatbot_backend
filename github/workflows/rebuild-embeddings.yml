name: Rebuild Embeddings

on:
  repository_dispatch:
    types: [update-embeddings]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest cleaned CSV
        run: |
          curl -L -o all_ai_tools_cleaned.csv \
            "https://raw.githubusercontent.com/lbelt567/ai-tools-scraper/main/all_ai_tools_cleaned.csv"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy faiss-cpu openai python-dotenv

      - name: Rebuild FAISS index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python build_faiss_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_ai_tools_cleaned.csv tool_index.faiss tool_metadata.csv tool_metadata.pkl
          git commit -m "🤖 Auto-rebuild embeddings $(date +'%Y-%m-%d')" || echo "No changes"
          git push
